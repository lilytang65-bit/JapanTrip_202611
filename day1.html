<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 1｜岡山入境 → 廣島</title><link rel="stylesheet" href="assets/style.css"></head><body><nav class="nav"><div class="wrap"><a href="index.html">總覽</a><a href="day1.html">11/7</a><a href="day2.html">11/8</a><a href="day3.html">11/9</a><a href="day4.html">11/10</a><a href="day5.html">11/11</a><a href="documents.html">文件</a></div></nav><main class="wrap"><header class="head"><div class="k">DAY 1｜11/7（六）</div><h1>岡山入境 → 廣島</h1></header><div class="table-wrap"><table><thead><tr><th>時間</th><th>行程</th><th>動線與注意事項</th><th>連結</th></tr></thead><tbody><tr><td>14:35</td><td><strong>抵達岡山機場</strong></td><td>入境及提領行李，預留約 30～40 分鐘。</td><td><a class="btn" href="https://www.google.com/maps/search/?api=1&query=Okayama+Airport" target="_blank" rel="noopener">地圖</a></td></tr><tr><td>15:30</td><td><strong>機場巴士 → 岡山站</strong></td><td>依當日實際班次搭乘。</td><td><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=Okayama+Station" target="_blank" rel="noopener">導航</a></td></tr><tr><td>16:05</td><td><strong>領取 JR Pass</strong></td><td>使用有 PASSPORT 標誌的綠色售票機。</td><td><a class="btn" href="documents.html" target="_blank" rel="noopener">票券資料</a></td></tr><tr><td>16:30</td><td><strong>岡山站 → 廣島站</strong></td><td>依車站電子看板確認車次及月台。</td><td><a class="btn" href="https://www.google.com/maps/search/?api=1&query=Hiroshima+Station" target="_blank" rel="noopener">廣島站</a></td></tr><tr><td>18:00</td><td><strong>縮景園／八丁堀</strong></td><td>若抵達延誤，改在廣島站附近用餐。</td><td><a class="btn" href="https://www.google.com/maps/search/?api=1&query=Shukkeien+Hiroshima" target="_blank" rel="noopener">縮景園</a></td></tr></tbody></table></div></main><footer class="footer"><div class="wrap">2026 廣島・岡山楓旅｜出發前再次確認交通、天氣與官方公告。</div></footer></body></html>
